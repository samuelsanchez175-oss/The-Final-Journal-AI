.total.bad { color: var(--fail); font-weight: 600; }
.checks { grid-column: 2 / 4; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.checks .x { color: var(--fail); }
.meaning { grid-column: 2 / 4; font-size: 13px; color: var(--muted); font-style: italic; }
.problems { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }

.problems.notes ul { color: var(--muted); }
.checks .soft { color: var(--muted); font-style: italic; }

details { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; }
.ex { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }

.attempts { font-size: 13px; color: var(--muted); }
.attempts ol { padding-left: 18px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
@media (max-width: 560px) { .bar { grid-template-columns: 22px 1fr; } .right { grid-column: 2; } .checks, .meaning { grid-column: 2; } .line { font-size: 16px; } }

  const soft = (ok, label) => `<span class="${ok ? "" : "soft"}">${ok ? "✓" : "~"} ${label}</span>`;
  const chk = (ok, label) => `<span class="${ok ? "" : "x"}">${ok ? "✓" : "✗"} ${label}</span>`;
  const okSyl = b.syllables >= range[0] && b.syllables <= range[1];
  return `<div class="bar">
    <span class="num">${i + 1}</span>
    <span class="line">${line}</span>
    <span class="right"><span class="total ${okSyl ? "" : "bad"}">${b.syllables} syl</span><span class="letter L-${esc(b.rhyme_letter)}">${esc(b.rhyme_letter)}</span></span>
    <span class="checks">${chk(c.one_comma, "one comma")}${chk(c.not_a_copy, "not a copied bar")}${soft(c.setup_shorter, "short setup, longer payoff")}${soft(c.syllables, `${range[0]}–${range[1]} syl`)}${b.internal && b.internal.length ? `<span>internal rhyme: ${b.internal.map(p => p.join("/")).map(esc).join(", ")}</span>` : ""}${b.borrowed ? `<span>borrows “${esc(b.borrowed)}”</span>` : ""}</span>
    ${b.meaning ? `<span class="meaning">Meaning: ${esc(b.meaning)}</span>` : ""}
  </div>`;
}

function render(model) {
  const r = DATA.models[model];
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.m === model));
  try { localStorage.setItem("sparkler-tab", model); } catch (e) {}
  if (!r || !r.bars || !r.bars.length) {
    document.getElementById("view").innerHTML = `<div class="panel"><div class="empty">No usable output from ${esc(LABEL[model] || model)}.</div></div>`;
    return;
  }
  const scheme = r.bars.map(b => b.rhyme_letter).join("");
  const problems = r.problems.length
    ? `<div class="problems">Still failing after ${r.attempts.length} attempt(s):<ul>${r.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`
    : `<div class="problems ok">All must-pass rules pass (attempt ${r.attempts.length}).</div>`;
  const notes = (r.notes || []).length
    ? `<div class="problems notes">Soft targets missed (not retried):<ul>${r.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : "";
  const tries = r.attempts.length > 1
    ? `<details class="attempts"><summary>Earlier attempts</summary><ol>${r.attempts.slice(0, -1).map(a => `<li>${a.bars ? a.bars.map(esc).join("<br>") : esc(a.error)}${a.problems ? `<br><em>${a.problems.length} problems</em>` : ""}</li>`).join("")}</ol></details>`
    : "";
  document.getElementById("view").innerHTML = `<div class="panel" role="tabpanel">
    <div class="meta"><span>Measured scheme: <b>${esc(scheme)}</b> (asked ${esc(DATA.scheme.toUpperCase())})</span><span>${esc(DATA.mode || "fresh")} mode</span><span>${r.elapsed_s}s</span><span>${r.attempts.length} attempt(s)</span></div>
    ${r.bars.map((b, i) => barRow(b, i, DATA.syl_range)).join("")}
    ${problems}${notes}${tries}
  </div>`;
}

function init() {
  if (!DATA) { document.getElementById("view").innerHTML = `<div class="empty">No data embedded yet. Run phase6_compare_models.py.</div>`; return; }
  document.getElementById("sub").textContent =
    `${DATA.artist} · ${DATA.bars_requested} bars · topic: ${DATA.topic_brief} · scheme ${DATA.scheme.toUpperCase()} · same prompt for every model. Highlighted = internal rhyme, underlined = end word, small numbers = syllables per half (CMUdict).`;
  const models = Object.keys(DATA.models);
  document.getElementById("tabs").innerHTML = models.map(m =>
    `<button class="tab" role="tab" data-m="${esc(m)}"><span class="dot ${DATA.models[m].passed ? "ok" : ""}"></span>${esc(LABEL[m] || m)}</button>`).join("");
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => render(t.dataset.m)));
  document.getElementById("exlist").innerHTML = (DATA.exemplars || []).map(p =>
    `<div><b>${esc(p.song)}${p.topic ? " · " + esc(p.topic) : ""}</b>${p.bars.map(esc).join("\n")}</div>`).join("");
  let start = models[0];
  try { const s = localStorage.getItem("sparkler-tab"); if (s && models.includes(s)) start = s; } catch (e) {}
  render(start);
}
init();
</script>
</body>
</html>
